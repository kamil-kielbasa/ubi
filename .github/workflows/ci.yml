name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - '.github/workflows/docs.yml'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - '.github/workflows/docs.yml'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-latest
    container: ghcr.io/zephyrproject-rtos/ci:v0.27.4
    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
    strategy:
      fail-fast: true
      matrix:
        mem: [static, heap]
    name: native-tests (${{ matrix.mem }})
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: ubi

      - name: Initialize west workspace
        run: |
          west init -l ubi
          west update --narrow -o=--depth=1

      - name: Build tests (native_sim, ${{ matrix.mem }})
        run: |
          west build -p --build-dir build/native_sim/tests \
            -b native_sim ubi/tests/ \
            ${{ matrix.mem == 'heap' && '-- -DCONFIG_UBI_MEM_BACKEND_HEAP=y' || '' }}

      - name: Run tests (native_sim, ${{ matrix.mem }})
        run: ./build/native_sim/tests/zephyr/zephyr.exe

  cross-build:
    runs-on: ubuntu-latest
    container: ghcr.io/zephyrproject-rtos/ci:v0.27.4
    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
    strategy:
      fail-fast: false
      matrix:
        board: [b_u585i_iot02a, nrf5340dk/nrf5340/cpuapp]
        mem: [static, heap]
        app: [tests, sample]
        include:
          - board: b_u585i_iot02a
            board-slug: b_u585i_iot02a
          - board: nrf5340dk/nrf5340/cpuapp
            board-slug: nrf5340dk_cpuapp
    name: cross-build (${{ matrix.board-slug }}, ${{ matrix.app }}, ${{ matrix.mem }})
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: ubi

      - name: Initialize west workspace
        run: |
          west init -l ubi
          west update --narrow -o=--depth=1

      - name: Build ${{ matrix.app }} (${{ matrix.board-slug }}, ${{ matrix.mem }})
        run: |
          west build -p \
            --build-dir build/${{ matrix.board-slug }}/${{ matrix.app }} \
            -b ${{ matrix.board }} ubi/${{ matrix.app }}/ \
            ${{ matrix.mem == 'heap' && '-- -DCONFIG_UBI_MEM_BACKEND_HEAP=y' || '' }}

      - name: Measure flash usage
        if: matrix.app == 'sample' && matrix.mem == 'static'
        run: |
          SIZE_TOOL=$(find /opt/toolchains -name "arm-zephyr-eabi-size" -type f | head -1)
          echo "=== ${{ matrix.board-slug }} flash usage ==="
          ${SIZE_TOOL} build/${{ matrix.board-slug }}/sample/zephyr/zephyr.elf
          ${SIZE_TOOL} -A \
            build/${{ matrix.board-slug }}/sample/modules/ubi/lib/lib..__ubi__lib.a \
            | tee flash_usage.txt

      - name: Upload flash usage report
        if: matrix.app == 'sample' && matrix.mem == 'static'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flash-usage-${{ matrix.board-slug }}
          path: flash_usage.txt
          retention-days: 14

  coverage:
    needs: native-tests
    runs-on: ubuntu-latest
    container: ghcr.io/zephyrproject-rtos/ci:v0.27.4
    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: ubi

      - name: Initialize west workspace
        run: |
          west init -l ubi
          west update --narrow -o=--depth=1

      - name: Install lcov and curl
        run: apt-get update && apt-get install -y lcov curl

      - name: Build tests with coverage
        run: |
          west build -p --build-dir build/coverage \
            -b native_sim ubi/tests/ \
            -- -DOVERLAY_CONFIG="$(pwd)/ubi/tests/boards/native_sim_coverage.conf"

      - name: Run tests
        run: ./build/coverage/zephyr/zephyr.exe

      - name: Collect coverage
        run: |
          lcov --capture \
            --directory build/coverage \
            --output-file coverage.info \
            --rc lcov_branch_coverage=1
          lcov --extract coverage.info '*/lib/src/*' \
            --output-file coverage_filtered.info \
            --rc lcov_branch_coverage=1
          genhtml coverage_filtered.info \
            --output-directory coverage_html \
            --branch-coverage \
            --title "UBI Code Coverage"
          lcov --summary coverage_filtered.info --rc lcov_branch_coverage=1
          lcov --capture \
            --directory build/coverage \
            --output-file coverage_lines.info
          lcov --extract coverage_lines.info '*/lib/src/*' \
            --output-file coverage_lines_filtered.info
          lcov --summary coverage_lines_filtered.info

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage_html/
          retention-days: 14

      - name: Upload coverage reports to Codecov
        if: >-
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@aa56896cf108bd10b5eb883cd1d24196da57f695 # v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage_lines_filtered.info
          disable_search: true
          flags: unittests
          fail_ci_if_error: false
