name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - '.github/workflows/docs.yml'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - '.github/workflows/docs.yml'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_IMAGE: ghcr.io/zephyrproject-rtos/ci:v0.27.4

jobs:
  native-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        mem: [static, heap]
        geometry: [default, nrf5340, stm32u5]
        crypto: [plain, secure]
    name: native-tests (${{ matrix.mem }}, ${{ matrix.geometry }}, ${{ matrix.crypto }})
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache
          sudo docker image prune --all --force

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: ubi

      - name: Initialize west workspace
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/ws -w /ws \
            -e CMAKE_PREFIX_PATH=/opt/toolchains \
            $CI_IMAGE bash -c "
              git config --global --add safe.directory '*'
              west init -l ubi
              west update --narrow -o=--depth=1
            "

      - name: Build tests (native_sim, ${{ matrix.mem }}, ${{ matrix.geometry }}, ${{ matrix.crypto }})
        env:
          MEM: ${{ matrix.mem }}
          GEOMETRY: ${{ matrix.geometry }}
          CRYPTO: ${{ matrix.crypto }}
        run: |
          EXTRA=""
          [[ "$MEM" == "heap" ]] && EXTRA+=" -DCONFIG_UBI_MEM_BACKEND_HEAP=y"
          [[ "$GEOMETRY" != "default" ]] && \
            EXTRA+=" -DDTC_OVERLAY_FILE=/ws/ubi/tests/boards/native_sim_${GEOMETRY}.overlay"
          [[ "$CRYPTO" == "secure" ]] && \
            EXTRA+=" -DOVERLAY_CONFIG=/ws/ubi/tests/boards/native_sim_secure.conf"
          docker run --rm -v "$GITHUB_WORKSPACE":/ws -w /ws \
            -e CMAKE_PREFIX_PATH=/opt/toolchains \
            $CI_IMAGE bash -c "
              west build -p --build-dir build/native_sim/tests \
                -b native_sim ubi/tests/ \
                ${EXTRA:+-- $EXTRA}
            "

      - name: Run tests (native_sim, ${{ matrix.mem }}, ${{ matrix.geometry }}, ${{ matrix.crypto }})
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/ws -w /ws \
            $CI_IMAGE ./build/native_sim/tests/zephyr/zephyr.exe

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [b_u585i_iot02a, nrf5340dk/nrf5340/cpuapp]
        mem: [static, heap]
        app: [tests, sample]
        include:
          - board: b_u585i_iot02a
            board-slug: b_u585i_iot02a
          - board: nrf5340dk/nrf5340/cpuapp
            board-slug: nrf5340dk_cpuapp
    name: cross-build (${{ matrix.board-slug }}, ${{ matrix.app }}, ${{ matrix.mem }})
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache
          sudo docker image prune --all --force

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: ubi

      - name: Initialize west workspace
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/ws -w /ws \
            -e CMAKE_PREFIX_PATH=/opt/toolchains \
            $CI_IMAGE bash -c "
              git config --global --add safe.directory '*'
              west init -l ubi
              west update --narrow -o=--depth=1
            "

      - name: Build ${{ matrix.app }} (${{ matrix.board-slug }}, ${{ matrix.mem }})
        env:
          BOARD: ${{ matrix.board }}
          BOARD_SLUG: ${{ matrix.board-slug }}
          APP: ${{ matrix.app }}
          MEM: ${{ matrix.mem }}
        run: |
          MEM_FLAG=""
          [[ "$MEM" == "heap" ]] && MEM_FLAG="-- -DCONFIG_UBI_MEM_BACKEND_HEAP=y"
          docker run --rm -v "$GITHUB_WORKSPACE":/ws -w /ws \
            -e CMAKE_PREFIX_PATH=/opt/toolchains \
            $CI_IMAGE bash -c "
              west build -p \
                --build-dir build/${BOARD_SLUG}/${APP} \
                -b '${BOARD}' ubi/${APP}/ \
                ${MEM_FLAG}
            "

      - name: Measure flash usage
        if: matrix.app == 'sample' && matrix.mem == 'static'
        env:
          BOARD_SLUG: ${{ matrix.board-slug }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/ws -w /ws \
            $CI_IMAGE bash -c "
              SIZE_TOOL=\$(find /opt/toolchains -name 'arm-zephyr-eabi-size' -type f | head -1)
              echo '=== ${BOARD_SLUG} flash usage ==='
              \${SIZE_TOOL} build/${BOARD_SLUG}/sample/zephyr/zephyr.elf
              \${SIZE_TOOL} -A \
                build/${BOARD_SLUG}/sample/modules/ubi/lib/lib..__ubi__lib.a \
                | tee flash_usage.txt
            "

      - name: Upload flash usage report
        if: matrix.app == 'sample' && matrix.mem == 'static'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flash-usage-${{ matrix.board-slug }}
          path: flash_usage.txt
          retention-days: 14

  coverage:
    needs: native-tests
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache
          sudo docker image prune --all --force

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: ubi

      - name: Initialize west workspace
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/ws -w /ws \
            -e CMAKE_PREFIX_PATH=/opt/toolchains \
            $CI_IMAGE bash -c "
              git config --global --add safe.directory '*'
              west init -l ubi
              west update --narrow -o=--depth=1
            "

      - name: Build tests with coverage
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/ws -w /ws \
            -e CMAKE_PREFIX_PATH=/opt/toolchains \
            $CI_IMAGE bash -c "
              west build -p --build-dir build/coverage \
                -b native_sim ubi/tests/ \
                -- -DOVERLAY_CONFIG=/ws/ubi/tests/boards/native_sim_coverage.conf
            "

      - name: Run tests
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/ws -w /ws \
            $CI_IMAGE ./build/coverage/zephyr/zephyr.exe

      - name: Collect coverage
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/ws -w /ws \
            $CI_IMAGE bash -c "
              apt-get update -qq && apt-get install -y -qq lcov > /dev/null 2>&1
              lcov --capture \
                --directory build/coverage \
                --output-file coverage.info \
                --rc lcov_branch_coverage=1
              lcov --extract coverage.info '*/lib/src/*' \
                --output-file coverage_filtered.info \
                --rc lcov_branch_coverage=1
              genhtml coverage_filtered.info \
                --output-directory coverage_html \
                --branch-coverage \
                --title 'UBI Code Coverage'
              lcov --summary coverage_filtered.info --rc lcov_branch_coverage=1
              lcov --capture \
                --directory build/coverage \
                --output-file coverage_lines.info
              lcov --extract coverage_lines.info '*/lib/src/*' \
                --output-file coverage_lines_filtered.info
              lcov --summary coverage_lines_filtered.info
            "

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage_html/
          retention-days: 14

      - name: Upload coverage reports to Codecov
        if: >-
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@aa56896cf108bd10b5eb883cd1d24196da57f695 # v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage_lines_filtered.info
          disable_search: true
          flags: unittests
          fail_ci_if_error: false

  coverage-secure:
    needs: native-tests
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache
          sudo docker image prune --all --force

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: ubi

      - name: Initialize west workspace
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/ws -w /ws \
            -e CMAKE_PREFIX_PATH=/opt/toolchains \
            $CI_IMAGE bash -c "
              git config --global --add safe.directory '*'
              west init -l ubi
              west update --narrow -o=--depth=1
            "

      - name: Build tests with coverage (secure)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/ws -w /ws \
            -e CMAKE_PREFIX_PATH=/opt/toolchains \
            $CI_IMAGE bash -c "
              west build -p --build-dir build/coverage-secure \
                -b native_sim ubi/tests/ \
                -- -DOVERLAY_CONFIG=/ws/ubi/tests/boards/native_sim_coverage_secure.conf
            "

      - name: Run tests (secure)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/ws -w /ws \
            $CI_IMAGE ./build/coverage-secure/zephyr/zephyr.exe

      - name: Collect coverage
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/ws -w /ws \
            $CI_IMAGE bash -c "
              apt-get update -qq && apt-get install -y -qq lcov > /dev/null 2>&1
              lcov --capture \
                --directory build/coverage-secure \
                --output-file coverage_secure.info \
                --rc lcov_branch_coverage=1
              lcov --extract coverage_secure.info '*/lib/src/*' \
                --output-file coverage_secure_filtered.info \
                --rc lcov_branch_coverage=1
              genhtml coverage_secure_filtered.info \
                --output-directory coverage_secure_html \
                --branch-coverage \
                --title 'UBI Secure Code Coverage'
              lcov --summary coverage_secure_filtered.info --rc lcov_branch_coverage=1
              lcov --capture \
                --directory build/coverage-secure \
                --output-file coverage_secure_lines.info
              lcov --extract coverage_secure_lines.info '*/lib/src/*' \
                --output-file coverage_secure_lines_filtered.info
              lcov --summary coverage_secure_lines_filtered.info
            "

      - name: Upload coverage report (secure)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report-secure
          path: coverage_secure_html/
          retention-days: 14

      - name: Upload secure coverage to Codecov
        if: >-
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@aa56896cf108bd10b5eb883cd1d24196da57f695 # v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage_secure_lines_filtered.info
          disable_search: true
          flags: secure
          fail_ci_if_error: false
