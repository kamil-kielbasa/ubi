common:
  tags: ubi
  timeout: 300

tests:
  # STATIC backend (default)
  ubi.functional:
    platform_allow:
      - native_sim
      - b_u585i_iot02a
      - nrf5340dk/nrf5340/cpuapp
    harness: ztest

  ubi.stress:
    platform_allow:
      - native_sim
    filter: CONFIG_FLASH_SIMULATOR
    harness: ztest
    tags: ubi slow
    timeout: 600

  # HEAP backend
  ubi.functional.heap:
    platform_allow:
      - native_sim
      - b_u585i_iot02a
      - nrf5340dk/nrf5340/cpuapp
    harness: ztest
    extra_configs:
      - CONFIG_UBI_MEM_BACKEND_HEAP=y

  ubi.stress.heap:
    platform_allow:
      - native_sim
    filter: CONFIG_FLASH_SIMULATOR
    harness: ztest
    tags: ubi slow
    timeout: 600
    extra_configs:
      - CONFIG_UBI_MEM_BACKEND_HEAP=y

  # SECURE backend — STATIC
  ubi.secure.functional:
    platform_allow:
      - native_sim
    harness: ztest
    extra_conf_files:
      - boards/native_sim_secure.conf

  ubi.secure.stress:
    platform_allow:
      - native_sim
    filter: CONFIG_FLASH_SIMULATOR
    harness: ztest
    tags: ubi slow
    timeout: 600
    extra_conf_files:
      - boards/native_sim_secure.conf

  # SECURE backend — HEAP
  ubi.secure.functional.heap:
    platform_allow:
      - native_sim
    harness: ztest
    extra_conf_files:
      - boards/native_sim_secure.conf
    extra_configs:
      - CONFIG_UBI_MEM_BACKEND_HEAP=y

  ubi.secure.stress.heap:
    platform_allow:
      - native_sim
    filter: CONFIG_FLASH_SIMULATOR
    harness: ztest
    tags: ubi slow
    timeout: 600
    extra_conf_files:
      - boards/native_sim_secure.conf
    extra_configs:
      - CONFIG_UBI_MEM_BACKEND_HEAP=y

  # ---------------------------------------------------------------------------
  # Geometry variant: nRF5340 (erase 4096 / write-block 4 / partition 64 KB)
  # ---------------------------------------------------------------------------

  # PLAIN — STATIC — nRF5340
  ubi.functional.nrf5340:
    platform_allow:
      - native_sim
    harness: ztest
    extra_dtc_overlay_files:
      - boards/native_sim_nrf5340.overlay

  ubi.stress.nrf5340:
    platform_allow:
      - native_sim
    filter: CONFIG_FLASH_SIMULATOR
    harness: ztest
    tags: ubi slow
    timeout: 600
    extra_dtc_overlay_files:
      - boards/native_sim_nrf5340.overlay

  # PLAIN — HEAP — nRF5340
  ubi.functional.heap.nrf5340:
    platform_allow:
      - native_sim
    harness: ztest
    extra_configs:
      - CONFIG_UBI_MEM_BACKEND_HEAP=y
    extra_dtc_overlay_files:
      - boards/native_sim_nrf5340.overlay

  ubi.stress.heap.nrf5340:
    platform_allow:
      - native_sim
    filter: CONFIG_FLASH_SIMULATOR
    harness: ztest
    tags: ubi slow
    timeout: 600
    extra_configs:
      - CONFIG_UBI_MEM_BACKEND_HEAP=y
    extra_dtc_overlay_files:
      - boards/native_sim_nrf5340.overlay

  # SECURE — STATIC — nRF5340
  ubi.secure.functional.nrf5340:
    platform_allow:
      - native_sim
    harness: ztest
    extra_conf_files:
      - boards/native_sim_secure.conf
    extra_dtc_overlay_files:
      - boards/native_sim_nrf5340.overlay

  ubi.secure.stress.nrf5340:
    platform_allow:
      - native_sim
    filter: CONFIG_FLASH_SIMULATOR
    harness: ztest
    tags: ubi slow
    timeout: 600
    extra_conf_files:
      - boards/native_sim_secure.conf
    extra_dtc_overlay_files:
      - boards/native_sim_nrf5340.overlay

  # SECURE — HEAP — nRF5340
