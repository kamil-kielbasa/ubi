    extra_dtc_overlay_files:
      - boards/native_sim_stm32u5.overlay

  ubi.secure.stress.stm32u5:
    platform_allow:
      - native_sim
    filter: CONFIG_FLASH_SIMULATOR
    harness: ztest
    tags: ubi slow
    timeout: 600
    extra_conf_files:
      - boards/native_sim_secure.conf
    extra_dtc_overlay_files:
      - boards/native_sim_stm32u5.overlay

  # SECURE — HEAP — STM32U5
