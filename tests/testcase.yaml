    extra_dtc_overlay_files:
      - boards/native_sim_stm32u5.overlay

  ubi.secure.stress.heap.stm32u5:
    platform_allow:
      - native_sim
    filter: CONFIG_FLASH_SIMULATOR
    harness: ztest
    tags: ubi slow
