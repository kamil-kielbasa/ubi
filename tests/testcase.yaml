    platform_allow:
      - native_sim
    harness: ztest
    extra_conf_files:
      - boards/native_sim_secure.conf
    extra_configs:
      - CONFIG_UBI_MEM_BACKEND_HEAP=y
    extra_dtc_overlay_files:
      - boards/native_sim_nrf5340.overlay

  ubi.secure.stress.heap.nrf5340:
