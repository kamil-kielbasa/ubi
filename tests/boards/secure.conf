# Secure backend configuration for cross-build targets.
# Cross-builds are compile-only (no execution), so a test entropy source
# is acceptable where hardware entropy requires IPC (e.g. nRF5340 rng_hci).
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_MBEDTLS_ENTROPY_POLL_ZEPHYR=y
CONFIG_UBI_CRYPTO=y
