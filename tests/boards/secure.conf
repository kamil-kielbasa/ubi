# Secure backend configuration for cross-build targets.
# Cross-builds are compile-only (no execution), so a test entropy source
# is acceptable where hardware entropy requires IPC (e.g. nRF5340 rng_hci).
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_MBEDTLS_ENTROPY_POLL_ZEPHYR=y
CONFIG_UBI_CRYPTO=y
CONFIG_UBI_CRYPTO_TEST_FAULT_INJECTION=y

# Lower budget thresholds for integration tests (§14.5 budget test).
CONFIG_UBI_CRYPTO_LEB_WRITE_BUDGET=100
CONFIG_UBI_CRYPTO_LEB_TOTAL_AUTH_BYTES_BUDGET=10000
CONFIG_UBI_CRYPTO_METADATA_COUNTER_BUDGET=100
CONFIG_UBI_CRYPTO_METADATA_TOTAL_AUTH_BYTES_BUDGET=10000

# PSA Crypto (mbedTLS) requires more stack on Cortex-M than the default 1 KiB.
CONFIG_MAIN_STACK_SIZE=8192
