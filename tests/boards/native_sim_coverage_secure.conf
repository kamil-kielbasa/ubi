# Secure backend + coverage configuration for native_sim
CONFIG_COVERAGE=y
CONFIG_COVERAGE_GCOV=y
CONFIG_COVERAGE_DUMP=y

# Platform entropy (native_sim uses fake entropy for testing)
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_INIT_PRIORITY=30
CONFIG_MBEDTLS_ENTROPY_POLL_ZEPHYR=y

# PSA Crypto prerequisites (PSA_WANT_* auto-selected by UBI_CRYPTO)
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y

# UBI secure backend
CONFIG_UBI_CRYPTO=y
