# Secure backend + coverage configuration for native_sim
CONFIG_COVERAGE=y
CONFIG_COVERAGE_GCOV=y
CONFIG_COVERAGE_DUMP=y

# Platform entropy (native_sim uses fake entropy for testing)
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_INIT_PRIORITY=30
CONFIG_MBEDTLS_ENTROPY_POLL_ZEPHYR=y

# PSA Crypto prerequisites (PSA_WANT_* auto-selected by UBI_SECURE)
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y

# UBI secure backend
CONFIG_UBI_SECURE=y
CONFIG_UBI_SECURE_TEST_FAULT_INJECTION=y

# Two concurrent devices needed by the plain+secure coexistence test.
CONFIG_UBI_MAX_NR_OF_DEVICES=2

# Lower budget thresholds for integration tests.
# Must match native_sim_secure.conf so the runtime_policy budget tests
# (which use BUDGET_HEADROOM=5) trip at the expected counter values.
CONFIG_UBI_SECURE_LEB_WRITE_BUDGET=100
CONFIG_UBI_SECURE_LEB_TOTAL_AUTH_BYTES_BUDGET=10000
CONFIG_UBI_SECURE_METADATA_COUNTER_BUDGET=100
CONFIG_UBI_SECURE_METADATA_TOTAL_AUTH_BYTES_BUDGET=10000
