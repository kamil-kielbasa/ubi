# Secure backend configuration for native_sim with chunked LEB mode
CONFIG_FLASH_SIMULATOR=y
CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=y
CONFIG_FLASH_SIMULATOR_EXPLICIT_ERASE=y
CONFIG_FLASH_SIMULATOR_STATS=y

# Platform entropy (native_sim uses fake entropy for testing)
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_INIT_PRIORITY=30
CONFIG_MBEDTLS_ENTROPY_POLL_ZEPHYR=y

# PSA Crypto prerequisites (PSA_WANT_* auto-selected by UBI_CRYPTO)
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y

# UBI secure backend
CONFIG_UBI_CRYPTO=y
CONFIG_UBI_CRYPTO_TEST_FAULT_INJECTION=y

# Two concurrent devices needed by the plain+secure coexistence test.
CONFIG_UBI_MAX_NR_OF_DEVICES=2

# Lower budget thresholds for integration tests (§14.5 budget test).
CONFIG_UBI_CRYPTO_LEB_WRITE_BUDGET=100
CONFIG_UBI_CRYPTO_LEB_TOTAL_AUTH_BYTES_BUDGET=10000
CONFIG_UBI_CRYPTO_METADATA_COUNTER_BUDGET=100
CONFIG_UBI_CRYPTO_METADATA_TOTAL_AUTH_BYTES_BUDGET=10000

# Chunked LEB mode with 256-byte chunks (§7.8, §15.3)
CONFIG_UBI_CRYPTO_LEB_CHUNKED=y
CONFIG_UBI_CRYPTO_LEB_CHUNK_SIZE=256
