<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
     role="img" aria-label="Secure UBI attach-time interaction sequence between Application, UBI SECURE, and Flash">
  <title>Secure UBI attach-time interaction</title>
  <desc>At attach time the application supplies a key-version policy. UBI authenticates reserved metadata, reads write_active_key_version from the secure device header, asks the application for the matching PSA key id, scans data PEBs to select live mappings, and consults the freshness-store callback. The application accepts or rejects, and UBI emits events on policy or auth failures.</desc>

  <defs>
    <style>
      .lifeline-box { fill: #c2d4ec; stroke: #6b7c93; stroke-width: 1.5; rx: 6; }
      .lifeline-lbl { fill: #1f2d3d; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .lifeline     { stroke: #6b7c93; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .arrow        { stroke: #1f2d3d; stroke-width: 1.4; fill: none; }
      .arrow-async  { stroke: #1f2d3d; stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; }
      .msg          { fill: #1f2d3d; font-size: 11px; }
      .heading      { fill: #1f2d3d; font-size: 15px; font-weight: 700; text-anchor: middle; }
      .legend       { fill: #6b7c93; font-size: 10px; }
    </style>
    <marker id="att-arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1f2d3d"/>
    </marker>
    <marker id="att-arr-open" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#1f2d3d" stroke-width="1.4"/>
    </marker>
  </defs>

  <text class="heading" x="400" y="26">Secure UBI — attach-time interaction</text>

  <!-- lifeline boxes (top) -->
  <rect class="lifeline-box" x="60"  y="50" width="140" height="36"/>
  <text class="lifeline-lbl" x="130" y="73">Application</text>

  <rect class="lifeline-box" x="330" y="50" width="140" height="36"/>
  <text class="lifeline-lbl" x="400" y="73">UBI SECURE</text>

  <rect class="lifeline-box" x="600" y="50" width="140" height="36"/>
  <text class="lifeline-lbl" x="670" y="73">Flash</text>

  <!-- vertical lifelines -->
  <line class="lifeline" x1="130" y1="86" x2="130" y2="440"/>
  <line class="lifeline" x1="400" y1="86" x2="400" y2="440"/>
  <line class="lifeline" x1="670" y1="86" x2="670" y2="440"/>

  <!-- 1: APP -> UBI : policy -->
  <line class="arrow" x1="130" y1="115" x2="400" y2="115" marker-end="url(#att-arr)"/>
  <text class="msg"  x="265" y="110" text-anchor="middle">policy {allowlist, optional requested_write_key_version}</text>

  <!-- 2: UBI -> FLASH : authenticate reserved metadata -->
  <line class="arrow" x1="400" y1="155" x2="670" y2="155" marker-end="url(#att-arr)"/>
  <text class="msg"  x="535" y="150" text-anchor="middle">authenticate reserved metadata</text>

  <!-- 3: UBI -> FLASH : read write_active_key_version -->
  <line class="arrow" x1="400" y1="195" x2="670" y2="195" marker-end="url(#att-arr)"/>
  <text class="msg"  x="535" y="190" text-anchor="middle">read write_active_key_version (secure device header)</text>

  <!-- 4: UBI -> APP : get_key_id -->
  <line class="arrow" x1="400" y1="235" x2="130" y2="235" marker-end="url(#att-arr)"/>
  <text class="msg"  x="265" y="230" text-anchor="middle">get_key_id(write_active_key_version)</text>

  <!-- 5: UBI -> FLASH : scan data PEBs -->
  <line class="arrow" x1="400" y1="275" x2="670" y2="275" marker-end="url(#att-arr)"/>
  <text class="msg"  x="535" y="270" text-anchor="middle">scan data PEBs · select live mappings</text>

  <!-- 6: UBI -.-> APP : check_freshness  (dashed = callback) -->
  <line class="arrow-async" x1="400" y1="320" x2="130" y2="320" marker-end="url(#att-arr-open)"/>
  <text class="msg"  x="265" y="315" text-anchor="middle">check_freshness({device_revision, global_sqnum})</text>

  <!-- 7: APP -.-> UBI : accept / reject -->
  <line class="arrow-async" x1="130" y1="360" x2="400" y2="360" marker-end="url(#att-arr-open)"/>
  <text class="msg"  x="265" y="355" text-anchor="middle">accept / reject</text>

  <!-- 8: UBI -.-> APP : events -->
  <line class="arrow-async" x1="400" y1="400" x2="130" y2="400" marker-end="url(#att-arr-open)"/>
  <text class="msg"  x="265" y="395" text-anchor="middle">events on policy or auth failures</text>

  <!-- legend -->
  <line class="arrow"       x1="540" y1="438" x2="570" y2="438" marker-end="url(#att-arr)"/>
  <text class="legend"      x="575" y="442">synchronous call</text>
  <line class="arrow-async" x1="540" y1="458" x2="570" y2="458" marker-end="url(#att-arr-open)"/>
  <text class="legend"      x="575" y="462">async / callback / event</text>
</svg>
