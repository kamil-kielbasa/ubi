<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
     role="img" aria-label="UBI on-flash layout: PEBs containing reserved metadata, EC header, VID header, and LEB data">
  <title>UBI on-flash layout</title>
  <desc>A flash partition is a sequence of physical eraseblocks. The first N PEBs are reserved (dual-bank metadata mirrors) and contain the device header and volume header table. Subsequent data PEBs each start with a 16-byte erase counter (EC) header at offset 0, followed by a 32-byte volume identifier (VID) header at offset 0x010, then the LEB data area.</desc>

  <defs>
    <style>
      .peb-frame { stroke: #6b7c93; stroke-width: 1.5; fill: #ffffff; }
      .ec        { fill: #c2d4ec; stroke: #6b7c93; stroke-width: 1; }
      .vid       { fill: #b0c4dc; stroke: #6b7c93; stroke-width: 1; }
      .data      { fill: #d6e4f5; stroke: #6b7c93; stroke-width: 1; }
      .reserved  { fill: #97aac4; stroke: #6b7c93; stroke-width: 1; }
      .devhdr    { fill: #97aac4; stroke: #6b7c93; stroke-width: 1; }
      .volhdr    { fill: #b3c1d6; stroke: #6b7c93; stroke-width: 1; }
      .free      { fill: #f0f3f8; stroke: #6b7c93; stroke-width: 1; stroke-dasharray: 4 3; }
      .lbl       { fill: #1f2d3d; font-size: 12px; font-weight: 600; }
      .sub       { fill: #1f2d3d; font-size: 10px; }
      .arrow     { stroke: #6b7c93; stroke-width: 1.2; fill: none; }
      .arrowhead { fill: #6b7c93; }
      .heading   { fill: #1f2d3d; font-size: 15px; font-weight: 700; }
      .legend    { fill: #1f2d3d; font-size: 11px; }
    </style>
    <marker id="arr" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" class="arrowhead"/>
    </marker>
  </defs>

  <!-- Title -->
  <text class="heading" x="360" y="28" text-anchor="middle">Flash partition: a sequence of Physical EraseBlocks (PEBs)</text>

  <!-- PEB strip -->
  <g transform="translate(40,55)">
    <!-- PEB 0: reserved -->
    <rect class="peb-frame reserved" x="0"   y="0" width="80" height="60"/>
    <text class="lbl"  x="40"  y="28" text-anchor="middle">PEB 0</text>
    <text class="sub"  x="40"  y="44" text-anchor="middle">reserved</text>

    <!-- PEB 1: reserved -->
    <rect class="peb-frame reserved" x="85"  y="0" width="80" height="60"/>
    <text class="lbl"  x="125" y="28" text-anchor="middle">PEB 1</text>
    <text class="sub"  x="125" y="44" text-anchor="middle">reserved</text>

    <!-- PEB 2: mapped -->
    <rect class="peb-frame data" x="170" y="0" width="80" height="60"/>
    <text class="lbl"  x="210" y="28" text-anchor="middle">PEB 2</text>
    <text class="sub"  x="210" y="44" text-anchor="middle">vol=A · LEB 0</text>

    <!-- PEB 3: mapped -->
    <rect class="peb-frame data" x="255" y="0" width="80" height="60"/>
    <text class="lbl"  x="295" y="28" text-anchor="middle">PEB 3</text>
    <text class="sub"  x="295" y="44" text-anchor="middle">vol=B · LEB 0</text>

    <!-- PEB 4: free -->
    <rect class="peb-frame free" x="340" y="0" width="80" height="60"/>
    <text class="lbl"  x="380" y="28" text-anchor="middle">PEB 4</text>
    <text class="sub"  x="380" y="44" text-anchor="middle">free</text>

    <!-- PEB 5: dirty -->
    <rect class="peb-frame data" x="425" y="0" width="80" height="60" opacity="0.55"/>
    <text class="lbl"  x="465" y="28" text-anchor="middle">PEB 5</text>
    <text class="sub"  x="465" y="44" text-anchor="middle">dirty</text>

    <!-- PEB N -->
    <text class="lbl"  x="540" y="34" text-anchor="middle">…</text>

    <!-- PEB last -->
    <rect class="peb-frame data" x="555" y="0" width="80" height="60"/>
    <text class="lbl"  x="595" y="28" text-anchor="middle">PEB N-1</text>
    <text class="sub"  x="595" y="44" text-anchor="middle">vol=A · LEB 3</text>
  </g>

  <!-- Two zoom-in arrows -->
  <line class="arrow" x1="125" y1="120" x2="125" y2="160" marker-end="url(#arr)"/>
  <text class="sub" x="138" y="145" text-anchor="start" fill="#6b7c93">zoom into a reserved PEB</text>

  <line class="arrow" x1="210" y1="265" x2="210" y2="305" marker-end="url(#arr)"/>
  <text class="sub" x="225" y="290" text-anchor="start" fill="#6b7c93">zoom into a data PEB</text>

  <!-- Reserved PEB layout -->
  <g transform="translate(40,170)">
    <text class="heading" x="320" y="0" text-anchor="middle">Inside a reserved PEB (dual-bank mirror)</text>

    <!-- Device Header -->
    <rect class="peb-frame devhdr" x="0"   y="20" width="100" height="60"/>
    <text class="lbl" x="50"  y="44" text-anchor="middle">Device Header</text>
    <text class="sub" x="50"  y="60" text-anchor="middle">offset 0x000</text>
    <text class="sub" x="50"  y="74" text-anchor="middle">32 B</text>

    <!-- Volume 0 Hdr -->
    <rect class="peb-frame volhdr" x="105" y="20" width="100" height="60"/>
    <text class="lbl" x="155" y="44" text-anchor="middle">Volume 0 Hdr</text>
    <text class="sub" x="155" y="60" text-anchor="middle">offset 0x020</text>
    <text class="sub" x="155" y="74" text-anchor="middle">48 B</text>

    <!-- Volume 1 Hdr -->
    <rect class="peb-frame volhdr" x="210" y="20" width="100" height="60"/>
    <text class="lbl" x="260" y="44" text-anchor="middle">Volume 1 Hdr</text>
    <text class="sub" x="260" y="60" text-anchor="middle">offset 0x050</text>
    <text class="sub" x="260" y="74" text-anchor="middle">48 B</text>

    <!-- ... -->
    <text class="lbl" x="340" y="54" text-anchor="middle">…</text>

    <!-- Volume N-1 Hdr -->
    <rect class="peb-frame volhdr" x="370" y="20" width="120" height="60"/>
    <text class="lbl" x="430" y="44" text-anchor="middle">Volume N-1 Hdr</text>
    <text class="sub" x="430" y="60" text-anchor="middle">48 B</text>
    <text class="sub" x="430" y="74" text-anchor="middle">N ≤ MAX_NR_OF_VOLUMES</text>

    <!-- Free space -->
    <rect class="peb-frame free" x="495" y="20" width="145" height="60"/>
    <text class="lbl" x="567" y="44" text-anchor="middle">free / erased</text>
    <text class="sub" x="567" y="60" text-anchor="middle">remainder of PEB</text>
  </g>

  <!-- Single data PEB layout -->
  <g transform="translate(40,310)">
    <text class="heading" x="320" y="0" text-anchor="middle">Inside a data PEB</text>

    <!-- EC header -->
    <rect class="peb-frame ec" x="0"   y="20" width="80"  height="60"/>
    <text class="lbl" x="40"  y="44" text-anchor="middle">EC header</text>
    <text class="sub" x="40"  y="60" text-anchor="middle">offset 0x000</text>
    <text class="sub" x="40"  y="74" text-anchor="middle">16 B</text>

    <!-- VID header -->
    <rect class="peb-frame vid" x="85"  y="20" width="80"  height="60"/>
    <text class="lbl" x="125" y="44" text-anchor="middle">VID header</text>
    <text class="sub" x="125" y="60" text-anchor="middle">offset 0x010</text>
    <text class="sub" x="125" y="74" text-anchor="middle">32 B</text>

    <!-- LEB data -->
    <rect class="peb-frame data" x="170" y="20" width="470" height="60"/>
    <text class="lbl" x="405" y="44" text-anchor="middle">LEB data area</text>
    <text class="sub" x="405" y="60" text-anchor="middle">offset = leb_data_start (write-aligned)</text>
    <text class="sub" x="405" y="74" text-anchor="middle">size = LEB size = PEB size − overhead</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40,440)">
    <rect class="devhdr"   x="0"   y="0"  width="14" height="14"/>
    <text class="legend"  x="20"  y="12">Device Header</text>
    <rect class="volhdr"   x="100" y="0"  width="14" height="14"/>
    <text class="legend"  x="120" y="12">Volume Header</text>
    <rect class="ec"       x="210" y="0"  width="14" height="14"/>
    <text class="legend"  x="230" y="12">EC header</text>
    <rect class="vid"      x="310" y="0"  width="14" height="14"/>
    <text class="legend"  x="330" y="12">VID header</text>
    <rect class="data"     x="410" y="0"  width="14" height="14"/>
    <text class="legend"  x="430" y="12">LEB data</text>
    <rect class="reserved" x="500" y="0"  width="14" height="14"/>
    <text class="legend"  x="520" y="12">reserved (dual-bank)</text>
  </g>
  <g transform="translate(40,460)">
    <rect class="free"     x="0" y="0" width="14" height="14"/>
    <text class="legend"  x="20"  y="12">free / erased</text>
  </g>
</svg>
