<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
     role="img" aria-label="Secure UBI key hierarchy: per-version IKM is HKDF-extracted into a PRK, then HKDF-expanded into per-domain child keys">
  <title>Secure UBI key hierarchy</title>
  <desc>Each key version v has its own root IKM (PSA-managed, ≥256 bits, device-unique). HKDF-Extract produces PRK[v]. HKDF-Expand with a fixed domain label produces five child keys: K_device_header, K_volume_header, K_erase_counter, K_volume_identifier, and K_leb. K_leb is further bound to the durable volume_id so each volume gets a unique per-volume LEB key.</desc>

  <defs>
    <style>
      .box      { stroke: #6b7c93; stroke-width: 1.5; rx: 6; }
      .ikm      { fill: #97aac4; }
      .prk      { fill: #b0c4dc; }
      .child    { fill: #c2d4ec; }
      .leaf     { fill: #d6e4f5; }
      .lbl      { fill: #1f2d3d; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .sub      { fill: #1f2d3d; font-size: 11px; text-anchor: middle; }
      .edge     { stroke: #6b7c93; stroke-width: 1.2; fill: none; }
      .edge-lbl { fill: #6b7c93; font-size: 11px; font-style: italic; }
      .heading  { fill: #1f2d3d; font-size: 15px; font-weight: 700; text-anchor: middle; }
    </style>
    <marker id="arr2" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7c93"/>
    </marker>
  </defs>

  <text class="heading" x="390" y="26">Secure UBI key hierarchy (per key version v)</text>

  <!-- IKM -->
  <rect class="box ikm" x="290" y="50" width="200" height="50"/>
  <text class="lbl" x="390" y="72">IKM[v]</text>
  <text class="sub" x="390" y="90">PSA-managed, ≥256 bits, device-unique</text>

  <!-- arrow IKM -> PRK -->
  <line class="edge" x1="390" y1="100" x2="390" y2="135" marker-end="url(#arr2)"/>
  <text class="edge-lbl" x="400" y="120" text-anchor="start">HKDF-Extract</text>

  <!-- PRK -->
  <rect class="box prk" x="315" y="140" width="150" height="40"/>
  <text class="lbl" x="390" y="165">PRK[v]</text>

  <!-- arrow PRK -> children fan-out -->
  <line class="edge" x1="390" y1="180" x2="390" y2="210" marker-end="url(#arr2)"/>
  <text class="edge-lbl" x="400" y="200" text-anchor="start">HKDF-Expand · fixed labels</text>

  <!-- horizontal fan: 5 children, x-centres at 80, 230, 390, 550, 700 -->
  <line class="edge" x1="80"  y1="230" x2="700" y2="230"/>
  <line class="edge" x1="80"  y1="230" x2="80"  y2="260"/>
  <line class="edge" x1="230" y1="230" x2="230" y2="260"/>
  <line class="edge" x1="390" y1="210" x2="390" y2="260"/>
  <line class="edge" x1="550" y1="230" x2="550" y2="260"/>
  <line class="edge" x1="700" y1="230" x2="700" y2="260"/>

  <!-- 5 children (140 wide each, centred on the x positions above) -->
  <g>
    <rect class="box child" x="10"  y="260" width="140" height="50"/>
    <text class="lbl" x="80"  y="282">K_device_header[v]</text>
    <text class="sub" x="80"  y="298">device header</text>
  </g>
  <g>
    <rect class="box child" x="160" y="260" width="140" height="50"/>
    <text class="lbl" x="230" y="282">K_volume_header[v]</text>
    <text class="sub" x="230" y="298">volume metadata</text>
  </g>
  <g>
    <rect class="box child" x="320" y="260" width="140" height="50"/>
    <text class="lbl" x="390" y="282">K_erase_counter[v]</text>
    <text class="sub" x="390" y="298">EC headers</text>
  </g>
  <g>
    <rect class="box child" x="480" y="260" width="140" height="50"/>
    <text class="lbl" x="550" y="282">K_volume_identifier[v]</text>
    <text class="sub" x="550" y="298">VID headers</text>
  </g>
  <g>
    <rect class="box child" x="640" y="260" width="140" height="50"/>
    <text class="lbl" x="700" y="282">K_leb[v]</text>
    <text class="sub" x="700" y="296">per-volume key</text>
    <text class="sub" x="700" y="307">parent</text>
  </g>

  <!-- LEB key further bound to volume_id -->
  <line class="edge" x1="700" y1="310" x2="700" y2="345" marker-end="url(#arr2)"/>
  <text class="edge-lbl" x="710" y="332" text-anchor="start">+ volume_id</text>

  <rect class="box leaf" x="610" y="350" width="180" height="50"/>
  <text class="lbl" x="700" y="372">K_leb[v][volume_id]</text>
  <text class="sub" x="700" y="388">unique per (version, volume)</text>
</svg>
