# Sample-only secure overlay. Build with:
#   west build -p -b native_sim sample/ \
#       -- -DOVERLAY_CONFIG=boards/secure.conf

# Platform entropy (native_sim uses fake entropy -- DO NOT use in production).
# Cross-builds for hardware are compile-only here, so a test entropy source
# is acceptable on every supported board.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_INIT_PRIORITY=30
CONFIG_MBEDTLS_ENTROPY_POLL_ZEPHYR=y

# PSA Crypto (PSA_WANT_* options are auto-selected by CONFIG_UBI_SECURE).
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y

# UBI secure backend.
CONFIG_UBI_SECURE=y

# PSA Crypto (mbedTLS) requires more stack on Cortex-M than the default 1 KiB.
CONFIG_MAIN_STACK_SIZE=8192
